<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#043e2f"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular backdrop -->
  <circle cx="200" cy="135" r="95" fill="#ffffff" opacity="0.05"/>
  <circle cx="200" cy="135" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Gift Box Group with Filter -->
  <g filter="url(#shadow)">
    <!-- Ribbon Bow Top -->
    <!-- Left Loop -->
    <path d="M 195 72 C 160 38 120 48 135 78 C 145 98 185 85 195 82 Z" fill="url(#goldGrad)"/>
    <!-- Right Loop -->
    <path d="M 205 72 C 240 38 280 48 265 78 C 255 98 215 85 205 82 Z" fill="url(#goldGrad)"/>
    <!-- Center Ribbon Knot -->
    <circle cx="200" cy="80" r="9" fill="#fde047"/>

    <!-- Box Lid -->
    <rect x="130" y="80" width="140" height="26" rx="5" fill="url(#lidGrad)"/>
    <!-- Box Lid Gold Ribbon -->
    <rect x="188" y="80" width="24" height="26" fill="url(#goldGrad)"/>

    <!-- Box Body -->
    <rect x="142" y="104" width="116" height="85" rx="6" fill="url(#boxGrad)"/>
    <!-- Box Body Vertical Gold Ribbon -->
    <rect x="188" y="104" width="24" height="85" fill="url(#goldGrad)"/>
    <!-- Box Body Horizontal Gold Ribbon -->
    <rect x="142" y="138" width="116" height="18" fill="url(#goldGrad)"/>
  </g>

  <!-- Sparkles -->
  <path d="M 115 65 L 120 75 L 130 80 L 120 85 L 115 95 L 110 85 L 100 80 L 110 75 Z" fill="url(#goldGrad)" opacity="0.75"/>
  <path d="M 285 75 L 288 82 L 295 85 L 288 88 L 285 95 L 282 88 L 275 85 L 282 82 Z" fill="url(#goldGrad)" opacity="0.75"/>
  <circle cx="280" cy="180" r="3" fill="#fde047" opacity="0.6"/>
  <circle cx="120" cy="170" r="2.5" fill="#fde047" opacity="0.6"/>

  <!-- Brand Label -->
  <text x="200" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">ยูนนาน YUNNAN IMPORT</text>
  <text x="200" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Prompt', sans-serif" font-size="11" font-weight="500" fill="#a7f3d0" text-anchor="middle" letter-spacing="0.5">ของรางวัลสะสมแต้ม</text>
</svg>